<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARCADE - Respiratory System</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
color:white;
text-align:center;

/* background image */
background:
linear-gradient(rgba(5,10,40,0.80), rgba(0,20,60,0.85)),
url("background.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* title */

h1{
margin-top:25px;
font-size:28px;
color:#8fd3ff;
text-shadow:0 0 10px #00c3ff;
}

/* model viewer */

model-viewer{
width:100%;
height:420px;
background:transparent;
}

/* hint */

.hint{
font-size:13px;
opacity:0.8;
margin-bottom:10px;
}

/* buttons */

.button{
display:inline-block;
margin:10px;
padding:12px 22px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:16px;

background:linear-gradient(45deg,#4b6fff,#7b4bff);
color:white;

box-shadow:0 0 10px rgba(120,120,255,0.6);
transition:0.2s;
}

.button:hover{
transform:scale(1.05);
box-shadow:0 0 15px #8f7cff;
}

/* reflection box */

textarea{
width:90%;
max-width:500px;
height:100px;
border-radius:10px;
border:none;
padding:10px;
font-size:14px;
resize:none;
}

/* celebration emoji */

.emoji{
position:fixed;
font-size:22px;
animation:fall 3s linear forwards;
}

@keyframes fall{
0%{transform:translateY(-50px)}
100%{transform:translateY(100vh)}
}

</style>
</head>

<body>

<h1>Respiratory System</h1>

<model-viewer
src="models/respiratory2.glb"
camera-controls
touch-action="pan-y"
ar
ar-modes="scene-viewer webxr quick-look"
scale="1 1 1"
auto-rotate
shadow-intensity="1"
exposure="1">

</model-viewer>

<div class="hint">
Drag to rotate • Pinch to zoom
</div>

<!-- Buttons -->

<button class="button" onclick="playAudio()">🔊 Listen</button>

<button class="button"
onclick="document.querySelector('model-viewer').activateAR()">
📱 View in AR
</button>

<br><br>

<h3>Reflection</h3>

<textarea id="reflection" placeholder="Write what you learned..."></textarea>

<br>

<button class="button" onclick="submitReflection()">
Submit Reflection
</button>

<!-- audio -->

<audio id="audio">
<source src="audio/respiratory.mp3" type="audio/mpeg">
</audio>

<script>

/* listen button */

function playAudio(){
document.getElementById("audio").play();
}

/* celebration */

function submitReflection(){

let text=document.getElementById("reflection").value.trim()

if(text===""){
alert("Please write a reflection first.")
return
}

alert("Great job! You earned points!")

celebrate()

}

/* emoji rain */

function celebrate(){

let emojis=["🎉","✨","🎊","👏","⭐","💙"]

for(let i=0;i<40;i++){

let e=document.createElement("div")

e.className="emoji"

e.innerText=emojis[Math.floor(Math.random()*emojis.length)]

e.style.left=Math.random()*100+"vw"

document.body.appendChild(e)

setTimeout(()=>{e.remove()},3000)

}

}

</script>

</body>
</html>
