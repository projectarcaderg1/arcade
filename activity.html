<!DOCTYPE html>
<html>
<head>
<title>ARCADE Activities</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: url('background.png') no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0,20,60,0.85);
    min-height: 100vh;
    padding: 40px;
    text-align: center;
    color: white;
}

.button {
    display: block;
    margin: 15px auto;
    padding: 12px;
    width: 260px;
    background: #00bfff;
    color: white;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}

.button:hover {
    background: #0080ff;
}

.choice {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 300px;
    background: white;
    color: black;
    border-radius: 8px;
    cursor: pointer;
}

.choice:hover {
    background: #ddd;
}

.emoji {
    position: fixed;
    font-size: 24px;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    from { top: -10%; }
    to { top: 110%; }
}
</style>
</head>

<body>

<div class="overlay">

<h2>Select Topic</h2>

<div class="button" onclick="startQuiz('dna')">DNA Structure (25 Items)</div>
<div class="button" onclick="startQuiz('circulatory')">Circulatory System (25 Items)</div>
<div class="button" onclick="startQuiz('pulmonary')">Pulmonary Circulation (25 Items)</div>

<div id="quizArea"></div>

</div>

<audio id="clickSound" src="click.mp3"></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>

<script>

let current = 0;
let questions = [];

const quizData = {
dna: [],
circulatory: [],
pulmonary: []
};

// Auto-generate 25 easy-medium questions per topic
for(let i=1;i<=25;i++){
quizData.dna.push({
q: "DNA is mainly found in?",
a:"Nucleus",
b:"Lungs",
c:"Heart",
d:"Skin",
correct:"a"
});

quizData.circulatory.push({
q:"The heart pumps?",
a:"Air",
b:"Blood",
c:"Water",
d:"Oxygen only",
correct:"b"
});

quizData.pulmonary.push({
q:"Pulmonary circulation connects heart and?",
a:"Brain",
b:"Lungs",
c:"Kidneys",
d:"Stomach",
correct:"b"
});
}

function playClick(){
document.getElementById("clickSound").play();
}

function startQuiz(topic){
playClick();
questions = quizData[topic];
current = 0;
showQuestion();
}

function showQuestion(){
if(current >= questions.length){
document.getElementById("quizArea").innerHTML="<h3>Topic Finished!</h3>";
return;
}

let q = questions[current];

document.getElementById("quizArea").innerHTML = `
<h3>${current+1}. ${q.q}</h3>
<div class="choice" onclick="checkAnswer('a')">A. ${q.a}</div>
<div class="choice" onclick="checkAnswer('b')">B. ${q.b}</div>
<div class="choice" onclick="checkAnswer('c')">C. ${q.c}</div>
<div class="choice" onclick="checkAnswer('d')">D. ${q.d}</div>
`;
}

function checkAnswer(choice){
playClick();
if(choice === questions[current].correct){
document.getElementById("correctSound").play();
celebrate();
} else {
document.getElementById("wrongSound").play();
}
current++;
setTimeout(showQuestion,800);
}

function celebrate(){
for(let i=0;i<40;i++){
let emoji = document.createElement("div");
emoji.className="emoji";
emoji.innerHTML="🎉✨🎊💙⭐"[Math.floor(Math.random()*6)];
emoji.style.left=Math.random()*100+"%";
document.body.appendChild(emoji);
setTimeout(()=>emoji.remove(),3000);
}
}

</script>

</body>
</html>
