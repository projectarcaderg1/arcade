<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE - Activity</title>

<style>

/* ---------- BACKGROUND ---------- */
body{
margin:0;
font-family:Arial, sans-serif;
color:white;
text-align:center;

background:
linear-gradient(rgba(5,15,40,.85),rgba(5,15,40,.9)),
url("background.png");
background-size:cover;
background-position:center;
}

/* LIGHTWEIGHT ORBS (NO LAG) */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(79,195,247,.15) 0 3px, transparent 4px),
radial-gradient(circle at 80% 60%, rgba(79,195,247,.15) 0 3px, transparent 4px);
animation:float 18s linear infinite;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-60px);}
}

/* ---------- LAYOUT ---------- */
.container{
max-width:650px;
margin:auto;
padding:20px;
}

/* ---------- BUTTONS ---------- */
button{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
background:#00c3ff;
color:white;
cursor:pointer;
transition:.2s;
}

button:active{
transform:scale(.96);
background:#0099cc;
}

.card{
background:rgba(0,0,0,.55);
padding:18px;
border-radius:15px;
margin-top:15px;
}

/* ---------- EMOJI ---------- */
.emoji{
position:fixed;
font-size:22px;
animation:fall 1.6s linear forwards;
}

@keyframes fall{
from{transform:translateY(-40px);}
to{transform:translateY(105vh);}
}

</style>
</head>

<body>

<div class="container">

<h1>🎮 ARCADE Activities</h1>
<p><b>Select a topic:</b></p>

<div id="menu">
<button onclick="startQuiz('resp')">🫁 Respiratory System</button>
<button onclick="startQuiz('dna')">🧬 DNA Structure</button>
<button onclick="startQuiz('pulmo')">❤️ Pulmonary Circulation</button>
</div>

<div id="quiz"></div>
<div id="score"></div>

</div>

<!-- ✅ LOCAL AUDIO (FAST + WORKING) -->
<audio id="clickSound" preload="auto" src="click.mp3"></audio>
<audio id="correctSound" preload="auto" src="correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="wrong.mp3"></audio>

<script>

/* ---------- QUESTIONS ---------- */

const quizzes={

resp:[
{q:"What organ helps you breathe?",o:["Heart","Lungs","Brain","Kidney"],a:1},
{q:"Air enters through?",o:["Nose","Skin","Leg","Hand"],a:0},
{q:"Gas needed by body?",o:["Oxygen","Smoke","Dust","Salt"],a:0},
{q:"Breathing out removes?",o:["Carbon dioxide","Water","Food","Oxygen"],a:0},
{q:"Windpipe name?",o:["Trachea","Vein","Bone","Tube"],a:0},
{q:"Tiny air sacs?",o:["Alveoli","Cells","Bones","Muscles"],a:0},
{q:"Breathing muscle?",o:["Diaphragm","Arm","Foot","Neck"],a:0},
{q:"System for breathing?",o:["Respiratory","Digestive","Nervous","Skeletal"],a:0},
{q:"Healthy lungs need?",o:["Exercise","Smoke","Dust","Trash"],a:0},
{q:"Air tubes inside lungs?",o:["Bronchi","Veins","Skin","Ribs"],a:0}
],

dna:[
{q:"DNA shape?",o:["Double helix","Square","Circle","Flat"],a:0},
{q:"DNA stores?",o:["Genetic info","Food","Water","Air"],a:0},
{q:"DNA location?",o:["Nucleus","Foot","Hair","Skin"],a:0},
{q:"DNA letters?",o:["ATCG","ABCD","WXYZ","EFGH"],a:0},
{q:"DNA controls?",o:["Traits","Weather","Sound","Light"],a:0},
{q:"DNA unit?",o:["Gene","Bone","Cell wall","Organ"],a:0},
{q:"DNA inherited from?",o:["Parents","Friends","Teacher","Food"],a:0},
{q:"DNA makes?",o:["Proteins","Rocks","Sand","Clouds"],a:0},
{q:"Shape looks like?",o:["Twisted ladder","Cube","Line","Dot"],a:0},
{q:"DNA inside?",o:["Cells","Shoes","Air","Water"],a:0}
],

pulmo:[
{q:"Pulmonary circulation connects?",o:["Heart & lungs","Brain & legs","Eyes & ears","Skin & bones"],a:0},
{q:"Blood goes to lungs for?",o:["Oxygen","Sugar","Salt","Water"],a:0},
{q:"Blood returns to?",o:["Heart","Kidney","Foot","Liver"],a:0},
{q:"Pulmonary artery carries?",o:["Oxygen-poor blood","Clean blood","Food","Water"],a:0},
{q:"Pulmonary vein carries?",o:["Oxygen-rich blood","Waste","Air","Salt"],a:0},
{q:"Gas exchange happens in?",o:["Alveoli","Bones","Skin","Brain"],a:0},
{q:"Main pump organ?",o:["Heart","Eye","Muscle","Lung"],a:0},
{q:"After oxygen blood becomes?",o:["Bright red","Blue","Green","Black"],a:0},
{q:"Circulation means?",o:["Blood movement","Eating","Sleeping","Talking"],a:0},
{q:"Works with lungs?",o:["Circulatory system","Digestive","Skeletal","Nervous"],a:0}
]

};

let quiz=[],index=0,score=0;

/* ---------- SOUND SAFE PLAY ---------- */
function play(id){
const s=document.getElementById(id);
s.currentTime=0;
s.play().catch(()=>{});
}

/* ---------- START ---------- */
function startQuiz(topic){
play("clickSound");
document.getElementById("menu").style.display="none";
quiz=quizzes[topic];
index=0;
score=0;
show();
}

/* ---------- SHOW QUESTION ---------- */
function show(){

if(index>=quiz.length){
document.getElementById("quiz").innerHTML="";
document.getElementById("score").innerHTML=
`🏆 Score: ${score}/10<br><br>
<button onclick="location.reload()">Back</button>`;
return;
}

let q=quiz[index];
let html=`<div class="card"><h3>${index+1}. ${q.q}</h3>`;

q.o.forEach((opt,i)=>{
html+=`<button onclick="answer(${i})">${opt}</button>`;
});

html+="</div>";
document.getElementById("quiz").innerHTML=html;
}

/* ---------- ANSWER ---------- */
function answer(c){

if(c===quiz[index].a){
score++;
play("correctSound");
emojiBurst();
}else{
play("wrongSound");
}

index++;
show();
}

/* ---------- LIGHT EMOJI (NO LAG) ---------- */
function emojiBurst(){
for(let i=0;i<12;i++){
let e=document.createElement("div");
e.className="emoji";
e.innerText=["🎉","⭐","✨","🥳"][Math.floor(Math.random()*4)];
e.style.left=Math.random()*100+"vw";
document.body.appendChild(e);
setTimeout(()=>e.remove(),1600);
}
}

</script>

</body>
</html>
