<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE Activities</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url("background.png") center/cover no-repeat fixed;
}
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(0,10,40,.8),rgba(10,0,50,.9));
z-index:-1;
}
h1{margin-top:20px;text-shadow:0 0 15px #00e1ff,0 0 30px #7a00ff;}
.arcade-btn{
margin:10px;
padding:14px;
width:260px;
font-size:16px;
border:none;
border-radius:12px;
color:white;
background:linear-gradient(45deg,#00c3ff,#7a00ff);
box-shadow:0 0 15px #7a00ff;
cursor:pointer;
}
.questionBox{
margin:20px auto;
width:90%;
max-width:500px;
background:#0b0033;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px #7a00ff;
}
.emoji{position:fixed;font-size:24px;animation:fall 2s linear forwards;pointer-events:none;}
@keyframes fall{0%{opacity:1;transform:translateY(-50px);}100%{opacity:0;transform:translateY(100vh);}}
</style>
</head>
<body>
<h1>📝 ARCADE Activity Center</h1>

<div id="menu">
<button class="arcade-btn" onclick="startTopic('resp')">🫁 Respiratory System</button><br>
<button class="arcade-btn" onclick="startTopic('circ')">❤️ Circulatory System</button><br>
<button class="arcade-btn" onclick="startTopic('pulmo')">🫀 Pulmonary Circulation</button><br>
<button class="arcade-btn" onclick="startTopic('coronary')">💓 Coronary Circulation</button><br>
<button class="arcade-btn" onclick="startTopic('chrom')">🧬 Chromosomes</button><br>
<button class="arcade-btn" onclick="startTopic('dna')">🧬 Double Helix DNA</button><br>
<button class="arcade-btn" onclick="startTopic('rutherford')">⚛️ Rutherford's Atom Model</button><br>
<button class="arcade-btn" onclick="startTopic('bohr')">⚛️ Neil Bohr Atom Model</button>
</div>

<div id="quizArea"></div>
<h2 id="score">Points: 0</h2>

<script>
let points=0;
function updateScore(){document.getElementById("score").innerText="Points: "+points;}
function emojiRain(){const emojis=["🎉","✨","⭐","💥","🚀","🎊"];for(let i=0;i<35;i++){const e=document.createElement("div");e.className="emoji";e.innerText=emojis[Math.floor(Math.random()*emojis.length)];e.style.left=Math.random()*window.innerWidth+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),2000);}}

const questions={
resp:[
["Which organ helps you breathe?","Heart","Lungs","Brain","Kidney","B"],
["Air enters through the?","Nose","Stomach","Leg","Skin","A"],
["Gas exchange happens in?","Alveoli","Veins","Bones","Muscles","A"],
["Breathing in is called?","Exhale","Inhale","Digest","Pump","B"],
["Oxygen moves into?","Blood","Hair","Nails","Teeth","A"],
["The diaphragm helps?","Breathing","Thinking","Walking","Eating","A"],
["Carbon dioxide leaves during?","Inhale","Exhale","Sleep","Run","B"],
["Respiratory system works with?","Circulatory","Digestive","Skeletal","None","A"],
["Main breathing muscle?","Diaphragm","Arm","Foot","Back","A"],
["Function of lungs?","Pump blood","Exchange gases","Digest food","Store water","B"]
],
circ:[
["Heart pumps blood to?","Lungs","Body","Brain","Stomach","B"],
["Blood travels through?","Arteries","Legs","Skin","Hair","A"],
["Veins carry blood?","To heart","Away from heart","Nowhere","To lungs","A"],
["Main blood cell?","Red blood cell","White blood cell","Platelet","Plasma","A"],
["Circulatory system helps with?","Transport","Digestion","Thinking","Moving","A"],
["Heart has how many chambers?","2","4","3","1","B"],
["Blood pressure measures?","Systolic & Diastolic","Heartbeats","Temperature","Oxygen","A"],
["Veins vs Arteries?","Veins to heart, Arteries from heart","Reverse","None","Both","A"],
["Blood contains?","Cells","Water","Bones","Hair","A"],
["Blood carries?","Oxygen & nutrients","Sugar","CO2","Heat","A"]
],
pulmo:[
["Pulmonary circulation connects?","Heart & lungs","Brain & legs","Skin & bones","Eyes & ears","A"],
["Blood goes to lungs to get?","Oxygen","Sugar","Water","Heat","A"],
["Blood leaving lungs is?","Oxygenated","Dirty","Cold","Dry","A"],
["Pulmonary artery carries?","Deoxygenated blood","Food","Air","Water","A"],
["Pulmonary vein carries?","Oxygenated blood","CO2","Waste","Fat","A"],
["Gas exchange happens in?","Lungs","Hands","Feet","Eyes","A"],
["Heart chamber sending blood to lungs?","Right ventricle","Left arm","Brain","Kidney","A"],
["Pulmonary means?","Related to lungs","Bones","Food","Energy","A"],
["Blood returns to?","Heart","Skin","Muscle","Hair","A"],
["Purpose of pulmonary circulation?","Oxygenate blood","Digest food","Move bones","Think","A"]
],
coronary:[
["Coronary arteries supply?","Heart muscles","Lungs","Brain","Kidneys","A"],
["Blockage leads to?","Heart attack","Cough","Fever","Cold","A"],
["Coronary veins drain?","Heart muscles","Lungs","Brain","Skin","A"],
["Heart tissue gets?","Oxygen & nutrients","Sugar","Water","Fat","A"],
["Angina means?","Chest pain","Headache","Stomach ache","Leg pain","A"],
["Heart needs blood for?","Energy","Sleep","Digestion","Breathing","A"],
["Heart tissue damage is called?","Myocardial infarction","Allergy","Stroke","A"],
["Coronary circulation is?","Heart only","Lungs only","Brain only","Body only","A"],
["Heart cells require?","Oxygen & nutrients","Water","Sugar","Protein","A"],
["Coronary vessels include?","Arteries & veins","Heart","Brain","Lungs","A"]
],
chrom:[
["Chromosomes carry?","Genes","Air","Water","Blood","A"],
["Humans have how many?","46","23","44","42","A"],
["Made of?","DNA & proteins","Fat","Sugar","Vitamins","A"],
["Chromosome found in?","Nucleus","Heart","Lungs","Skin","A"],
["Chromosome function?","Genetic info","Transport","Energy","Digestion","A"],
["Sex chromosomes are?","X & Y","A & B","C & D","M & N","A"],
["Autosomes are?","Non-sex","Sex","Blood","Bones","A"],
["Karyotype shows?","Chromosome pairs","Blood cells","Heart size","Eye color","A"],
["Mutation affects?","DNA","Bones","Oxygen","Muscles","A"],
["Chromosomes determine?","Traits","Height","Weight","Age","Hair","A"]
],
dna:[
["DNA stands for?","Deoxyribonucleic Acid","Digital Network","Data Node","None","A"],
["Shape of DNA?","Circle","Double Helix","Square","Triangle","B"],
["DNA found in?","Nucleus","Skin","Hair","Air","A"],
["DNA carries?","Energy","Genetic info","Water","Heat","B"],
["DNA made of?","Nucleotides","Cells","Bones","Organs","A"],
["Genes are part of?","DNA","Lungs","Blood","Brain","A"],
["DNA controls?","Traits","Weather","Sound","Light","A"],
["Humans share about?","10% DNA","50%","99.9%","0%","C"],
["DNA looks like a?","Twisted ladder","Ball","Cube","Line","A"],
["DNA helps in?","Growth","Cooking","Running","Sleeping","A"]
],
rutherford:[
["Rutherford model shows?","Protons","Electrons orbit","Neutrons","Atoms","B"],
["Atom nucleus contains?","Protons & Neutrons","Electrons","Only protons","Nothing","A"],
["Electrons orbit where?","Nucleus","Sky","Heart","Blood","A"],
["Alpha particle experiment?","Gold foil","Lead","Aluminum","Copper","A"],
["Rutherford concluded?","Mostly empty space","Full","Solid","Liquid","Gas","A"],
["Rutherford discovered?","Nucleus","Electrons","Protons","Neutrons","A"],
["Protons have?","Positive charge","Negative","Neutral","Mixed","A"],
["Nucleus is?","Dense center","Empty","Water","Air","A"],
["Electrons move around?","Nucleus","Heart","Blood","Feet","A"],
["Atom model significance?","Explains structure","Explains breathing","Explains digestion","Explains movement","A"]
],
bohr:[
["Bohr proposed?","Electrons in energy levels","Electrons random","Nucleus floats","Atoms merge","A"],
["Electrons exist in?","Specific orbits","Cloud","Heart","Skin","A"],
["Bohr model explains?","Atom behavior","Heart behavior","DNA behavior","Blood behavior","A"],
["Energy levels have?","Fixed energy","Random","Liquid","Gas","A"],
["Bohr said electrons?","Jump between levels","Stay still","Vibrate","Rotate","A"],
["Electrons move with?","Energy","Gravity","Motion","Heat","A"],
["Bohr model solves?","Structure problem","Circulation problem","Respiration problem","DNA problem","A"],
["Bohr energy levels formula?","E=-RH(1/n^2)","E=MC2","V=IR","P=F","A"],
["Bohr model shows?","Atoms have nucleus","Atoms are empty","Atoms are liquid","Atoms move","A"],
["Bohr contribution?","Explain spectra","Explain lungs","Explain blood","Explain DNA","A"]
]

};

/* ================= QUIZ ENGINE ================= */
let currentTopic=[];
let index=0;

function startTopic(topic){
document.getElementById("menu").style.display="none";
currentTopic=questions[topic];
index=0;
showQuestion();
}

function showQuestion(){
if(index>=currentTopic.length){
document.getElementById("quizArea").innerHTML=
"<h2>✅ Topic Finished!</h2><button class='arcade-btn' onclick='location.reload()'>Back to Topics</button>";
return;
}

let q=currentTopic[index];

document.getElementById("quizArea").innerHTML=`
<div class="questionBox">
<h3>${q[0]}</h3>
<button class="arcade-btn" onclick="answer('A')">A. ${q[1]}</button><br>
<button class="arcade-btn" onclick="answer('B')">B. ${q[2]}</button><br>
<button class="arcade-btn" onclick="answer('C')">C. ${q[3]}</button><br>
<button class="arcade-btn" onclick="answer('D')">D. ${q[4]}</button>
</div>
`;
}

function answer(choice){
let correct=currentTopic[index][5];
if(choice===correct){
points+=10;
updateScore();
emojiRain();
}else{
alert(`❌ Wrong! Correct answer: ${correct}`);
}
index++;
showQuestion();
}

</script>

</body>
</html>
