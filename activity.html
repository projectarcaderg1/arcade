}

</head>

<body>

let totalPoints = 0;

const quiz = document.getElementById("quiz");

topics.forEach((topic,ti)=>{

let html = `<div class="topic"><h2>${topic.name}</h2>`;

topic.questions.forEach((q,qi)=>{

html += `
<div class="question">
<p>${qi+1}. ${q.q}</p>
${q.o.map((opt,oi)=>`
<label>
<input type="radio" name="t${ti}q${qi}" value="${oi}">
${String.fromCharCode(65+oi)}. ${opt}
</label><br>
`).join("")}
</div>
`;

});

html += `<button onclick="submitTopic(${ti})">Submit ${topic.name}</button>
<div class="score" id="score${ti}"></div>
</div>`;

quiz.innerHTML += html;

});

function submitTopic(ti){

let topic = topics[ti];
let score = 0;

topic.questions.forEach((q,qi)=>{

let radios = document.getElementsByName(`t${ti}q${qi}`);

for(let r of radios){
if(r.checked && parseInt(r.value) === q.a){
score += 10;
}
}

});

totalPoints += score;

document.getElementById("score"+ti).innerText =
"Points Earned: "+score+" / 100";

alert("🎉 You earned "+score+" points for this topic!");

}

</script>

</body>
</html>
