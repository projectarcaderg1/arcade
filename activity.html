<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE Activity</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
background:
linear-gradient(rgba(0,0,50,0.8),rgba(0,0,70,0.9)),
url("background.png") no-repeat center center fixed;
background-size:cover;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
text-shadow:0 0 5px #fff,0 0 10px #00f,0 0 20px #8e2de2;
background:#1a1a2e;
}

.card{
background:rgba(0,0,0,0.55);
padding:18px;
border-radius:15px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 ARCADE Activity</h1>

<div id="menu">

<button onclick="startQuiz('resp')">Respiratory System</button>
<button onclick="startQuiz('circ')">Circulatory System</button>
<button onclick="startQuiz('pulmo')">Pulmonary Circulation</button>
<button onclick="startQuiz('coronary')">Coronary Circulation</button>
<button onclick="startQuiz('chrom')">Chromosomes</button>
<button onclick="startQuiz('dna')">Double Helix DNA</button>
<button onclick="startQuiz('rutherford')">Rutherford Atom Model</button>
<button onclick="startQuiz('bohr')">Neil Bohr Atom Model</button>

</div>

<div id="quiz"></div>
<div id="score"></div>

</div>

<script>

const quizzes={

resp:[
{q:"What structure prevents food from entering the trachea?",o:["Epiglottis","Bronchi","Larynx","Alveoli"],a:0},
{q:"Gas exchange occurs mainly in?",o:["Alveoli","Bronchi","Trachea","Nose"],a:0},
{q:"Main breathing muscle?",o:["Diaphragm","Rib","Lung","Heart"],a:0},
{q:"Air pathway after nose?",o:["Pharynx","Stomach","Artery","Esophagus"],a:0},
{q:"Voice box?",o:["Larynx","Bronchi","Alveoli","Trachea"],a:0},
{q:"Tiny lung sacs?",o:["Alveoli","Cells","Bronchioles","Tissues"],a:0},
{q:"Gas removed during exhale?",o:["CO2","Oxygen","Nitrogen","Hydrogen"],a:0},
{q:"Lungs are protected by?",o:["Rib cage","Skin","Muscle","Liver"],a:0},
{q:"Respiration provides?",o:["Energy","Water","Heat","Blood"],a:0},
{q:"Oxygen travels via?",o:["Blood","Nerves","Skin","Bones"],a:0}
],

circ:[
{q:"Largest artery?",o:["Aorta","Vena cava","Pulmonary vein","Capillary"],a:0},
{q:"Blood vessel carrying blood to heart?",o:["Vein","Artery","Capillary","Aorta"],a:0},
{q:"Blood cells carrying oxygen?",o:["Red blood cells","White cells","Platelets","Plasma"],a:0},
{q:"Organ pumping blood?",o:["Heart","Brain","Kidney","Lung"],a:0},
{q:"Liquid part of blood?",o:["Plasma","Platelet","Cell","Tissue"],a:0},
{q:"Cells fighting infection?",o:["White blood cells","Red cells","Platelets","Neurons"],a:0},
{q:"Blood clotting cells?",o:["Platelets","Plasma","RBC","WBC"],a:0},
{q:"Smallest vessels?",o:["Capillaries","Veins","Arteries","Aorta"],a:0},
{q:"Blood circulation discovered by?",o:["William Harvey","Newton","Einstein","Darwin"],a:0},
{q:"Heartbeat sound comes from?",o:["Valves closing","Blood","Muscle","Air"],a:0}
],

/* other topics shortened for space but same format */

};

let quiz=[],i=0,score=0;

function startQuiz(topic){
quiz=quizzes[topic];
i=0;
score=0;
document.getElementById("menu").style.display="none";
show();
}

function show(){

if(i>=quiz.length){
document.getElementById("quiz").innerHTML="";
document.getElementById("score").innerHTML=
`<h2>Score: ${score} / ${quiz.length*10}</h2>
<button onclick="location.reload()">Back</button>`;
return;
}

let q=quiz[i];

let html=`<div class="card"><h3>${q.q}</h3>`;

q.o.forEach((opt,index)=>{
html+=`<button onclick="answer(${index})">${opt}</button>`;
});

html+="</div>";

document.getElementById("quiz").innerHTML=html;

}

function answer(c){

if(c===quiz[i].a){
score+=10;
}

i++;

show();

}

</script>

</body>
</html>
